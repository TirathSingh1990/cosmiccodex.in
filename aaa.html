<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Navigation</title>
<style>
:root{box-sizing:border-box;--bg:#000;--route:#00e5ff;--side:#2b3f52;--banner:#005f5f;--fg:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#wrap{position:absolute;inset:0}
body.mirror #wrap{transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--banner);border-radius:22px;padding:14px 20px;font-size:clamp(26px,6vw,44px);line-height:1.2}
#banner .r2{display:flex;align-items:center;gap:10px}
.shield{display:inline-block;background:#f5c518;color:#000;border-radius:8px 8px 14px 14px;padding:0 12px;font-weight:700}
#speed{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:92px;height:92px;border-radius:50%;background:#000;border:2px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center}
#speed b{font-size:36px;line-height:1}
#speed small{font-size:14px}
#compass{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:84px;height:84px;border-radius:50%;background:#000;border:2px solid #222}
#ctl{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;opacity:.85}
button,label.b{background:#111;color:#bbb;border:1px solid #2a2a2a;border-radius:20px;padding:9px 14px;font-size:14px}
button.on{background:#06424a;color:#fff;border-color:#00e5ff}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="banner"><div>Stay on <span class="shield" id="rd">34</span></div><div class="r2"><span id="dist">--</span> to <span id="arrow">↰</span></div></div>
  <div id="speed"><b id="spd">0</b><small>km/h</small></div>
  <svg id="compass" viewBox="-50 -50 100 100"><g id="needle"><polygon points="0,-34 9,0 -9,0" fill="#e8e8e8"/><polygon points="0,34 9,0 -9,0" fill="#e53935"/></g><circle r="4" fill="#000" stroke="#555"/></svg>
</div>
<div id="ctl">
  <button id="bDemo" class="on">Demo</button>
  <button id="bGps">GPS</button>
  <label class="b">Route file<input type="file" id="file" accept=".json,.geojson,.txt,.csv"></label>
  <button id="bMir">Mirror (HUD)</button>
  <button id="bZin">＋</button>
  <button id="bZout">－</button>
  <button id="bHide">Hide</button>
</div>
<script>
(function(){
var ROAD="34";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=window.devicePixelRatio||1,zoom=1;
var route=[],side=[],origin={lat:30.3165,lng:78.0322};
var mode='demo',idx=0,s=0,pos={x:0,y:0},hd=0,speedKmh=35,gpsId=null,lastT=0;

function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();

function toXY(lat,lng){return {x:(lng-origin.lng)*111320*Math.cos(origin.lat*Math.PI/180),y:(lat-origin.lat)*110540};}
function bearing(a,b){var d=Math.atan2(b.x-a.x,b.y-a.y)*180/Math.PI;return (d+360)%360;}
function adiff(a,b){var d=((b-a+540)%360)-180;return d;}
function resample(p,step){
  if(p.length<2)return p;var out=[p[0]],acc=0,prev=p[0];
  for(var i=1;i<p.length;i++){
    var cur=p[i],d=Math.hypot(cur.x-prev.x,cur.y-prev.y);
    while(acc+d>=step){var t=(step-acc)/d;prev={x:prev.x+(cur.x-prev.x)*t,y:prev.y+(cur.y-prev.y)*t};out.push(prev);d=Math.hypot(cur.x-prev.x,cur.y-prev.y);acc=0;}
    acc+=d;prev=cur;
  }
  return out;
}

/* ---- demo route ---- */
function seedRand(n){return function(){n=(n*16807)%2147483647;return (n-1)/2147483646;}}
function buildDemo(){
  var r=seedRand(42),p=[],x=0,y=0,h=15,i;
  for(i=0;i<420;i++){
    var turn=0;
    if(i>=150&&i<156)turn=-14;
    if(i>=300&&i<306)turn=14;
    h+=turn+Math.cos(i/8)*2.6+Math.sin(i/3.3)*1.2;
    x+=Math.sin(h*Math.PI/180)*10;y+=Math.cos(h*Math.PI/180)*10;
    p.push({x:x,y:y});
  }
  var sd=[];
  for(var k=0;k<14;k++){
    var b=p[Math.floor(r()*400)],sx=b.x,sy=b.y,sh=r()*360,line=[{x:sx,y:sy}];
    for(var j=0;j<28;j++){sh+=(r()-.5)*40;sx+=Math.sin(sh*Math.PI/180)*25;sy+=Math.cos(sh*Math.PI/180)*25;line.push({x:sx,y:sy});}
    sd.push(line);
  }
  route=p;side=sd;idx=0;s=0;
}

/* ---- file loading ---- */
function loadText(t){
  var lines=[],sides=[];
  try{
    var g=JSON.parse(t),feats=g.features||(g.type?[g]:[]);
    feats.forEach(function(f){
      var gm=f.geometry||f,c=gm.coordinates;
      if(gm.type==='LineString')lines.push(c);
      else if(gm.type==='MultiLineString')c.forEach(function(l){lines.push(l);});
    });
    lines=lines.map(function(l){return l.map(function(q){return {lat:q[1],lng:q[0]};});});
  }catch(e){
    var pts=[];
    t.split(/\r?\n/).forEach(function(l){var m=l.match(/(-?\d+\.?\d*)\s*[, ;]\s*(-?\d+\.?\d*)/);if(m)pts.push({lat:+m[1],lng:+m[2]});});
    if(pts.length)lines=[pts];
  }
  if(!lines.length){alert('Route nahi mila. GeoJSON ya "lat,lng" lines do.');return;}
  lines.sort(function(a,b){return b.length-a.length;});
  origin={lat:lines[0][0].lat,lng:lines[0][0].lng};
  route=resample(lines[0].map(function(q){return toXY(q.lat,q.lng);}),10);
  side=lines.slice(1).map(function(l){return l.map(function(q){return toXY(q.lat,q.lng);});});
  idx=0;s=0;
}
document.getElementById('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){loadText(rd.result);setMode('demo',true);};rd.readAsText(f);
};

/* ---- modes ---- */
function setMode(m,keepRoute){
  mode=m;
  document.getElementById('bDemo').className=m==='demo'?'on':'';
  document.getElementById('bGps').className=m==='gps'?'on':'';
  if(gpsId!==null){navigator.geolocation.clearWatch(gpsId);gpsId=null;}
  if(m==='demo'){if(!keepRoute||!route.length)buildDemo();s=0;idx=0;}
  if(m==='gps'){
    if(!navigator.geolocation){alert('GPS available nahi hai');return setMode('demo');}
    if(!route.length||route[0].x===0&&route[0].y===0&&route.length===420)route=[];
    var first=true,prev=null;
    gpsId=navigator.geolocation.watchPosition(function(p){
      var c=p.coords,q=toXY(c.latitude,c.longitude);
      if(!route.length){origin={lat:c.latitude,lng:c.longitude};q={x:0,y:0};}
      if(prev&&Math.hypot(q.x-prev.x,q.y-prev.y)>2){var nb=bearing(prev,q);hd=first?nb:hd+adiff(hd,nb)*.4;first=false;}
      if(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)hd=c.heading;
      prev=q;pos=q;speedKmh=(c.speed||0)*3.6;
      if(route.length)nearest(true);
    },function(){alert('GPS permission/error. Demo mode par ja raha hoon.');setMode('demo');},{enableHighAccuracy:true,maximumAge:0});
  }
}
function nearest(full){
  var a=full?0:Math.max(0,idx-5),b=full?route.length:Math.min(route.length,idx+60),best=1e18,bi=idx;
  for(var i=a;i<b;i++){var d=(route[i].x-pos.x)*(route[i].x-pos.x)+(route[i].y-pos.y)*(route[i].y-pos.y);if(d<best){best=d;bi=i;}}
  idx=bi;
}

/* ---- next turn ---- */
function nextTurn(){
  for(var i=idx;i<route.length-7;i++){
    var d=Math.abs(adiff(bearing(route[i],route[i+3]),bearing(route[i+3],route[i+6])));
    if(d>45){
      var t=adiff(bearing(route[i],route[i+3]),bearing(route[i+3],route[i+6]));
      return {dist:(i-idx)*10,left:t<0};
    }
  }
  return {dist:Math.max(0,(route.length-1-idx)*10),end:true};
}
function fmt(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1)+' km':Math.round(m/10)*10+' m';}

/* ---- draw ---- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var cx=W/2,cy=H*0.78,sc=(cy-H*0.12)/(450/zoom),hr=hd*Math.PI/180,ch=Math.cos(hr),sh=Math.sin(hr);
  function P(p){var dx=p.x-pos.x,dy=p.y-pos.y;return [cx+(dx*ch-dy*sh)*sc,cy-(dx*sh+dy*ch)*sc];}
  function line(arr,from,to){
    ctx.beginPath();var st=false;
    for(var i=from;i<to;i++){var q=P(arr[i]);if(!st){ctx.moveTo(q[0],q[1]);st=true;}else ctx.lineTo(q[0],q[1]);}
    ctx.stroke();
  }
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#26384a';ctx.lineWidth=2;
  side.forEach(function(l){line(l,0,l.length);});
  if(route.length){
    var from=Math.max(0,idx-2);
    ctx.strokeStyle='#000';ctx.lineWidth=15;line(route,from,route.length);
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;
    ctx.strokeStyle='#00e5ff';ctx.lineWidth=10;line(route,from,route.length);
    ctx.shadowBlur=0;
  }
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='#2f8cff';ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(18,18);ctx.lineTo(0,9);ctx.lineTo(-18,18);ctx.closePath();ctx.stroke();ctx.fill();
  ctx.restore();
}

/* ---- loop ---- */
function frame(t){
  var dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;
  if(mode==='demo'&&route.length>8){
    speedKmh=35;s+=speedKmh/3.6*dt;
    var f=s/10,i=Math.floor(f);
    if(i>=route.length-4){s=0;f=0;i=0;}
    var a=route[i],b=route[i+1],u=f-i;
    pos={x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u};
    var tb=bearing(route[i],route[Math.min(route.length-1,i+3)]);
    hd=(hd+adiff(hd,tb)*Math.min(1,dt*4)+360)%360;idx=i;
  }
  draw();
  var nt=route.length?nextTurn():{dist:0};
  document.getElementById('dist').textContent=fmt(nt.dist);
  document.getElementById('arrow').textContent=nt.end?'⚑':(nt.left?'↰':'↱');
  document.getElementById('rd').textContent=ROAD;
  document.getElementById('spd').textContent=Math.round(speedKmh);
  document.getElementById('needle').setAttribute('transform','rotate('+(-hd)+')');
  requestAnimationFrame(frame);
}

/* ---- controls ---- */
document.getElementById('bDemo').onclick=function(){setMode('demo',true);};
document.getElementById('bGps').onclick=function(){setMode('gps');};
document.getElementById('bMir').onclick=function(){document.body.classList.toggle('mirror');this.classList.toggle('on');};
document.getElementById('bZin').onclick=function(){zoom=Math.min(4,zoom*1.3);};
document.getElementById('bZout').onclick=function(){zoom=Math.max(.4,zoom/1.3);};
var hidden=false,ctl=document.getElementById('ctl');
document.getElementById('bHide').onclick=function(){hidden=true;ctl.style.display='none';};
document.addEventListener('dblclick',function(){if(hidden){hidden=false;ctl.style.display='flex';}});
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}

buildDemo();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
