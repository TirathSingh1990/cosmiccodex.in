<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Navigation</title>
<style>
:root{--route:#00e5ff;--banner:#005f5f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0}
body.mirror #stage{transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%}
button{background:#141414;color:#ddd;border:1px solid #2c2c2c;border-radius:22px;padding:11px 16px;font-size:15px}
button.pri{background:#00a3b5;color:#001;border:0;font-weight:700}
button.on{background:#06424a;border-color:var(--route);color:#fff}
/* plan */
#plan{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#0d0d0d;border:1px solid #222;border-radius:18px;padding:12px;z-index:5;max-height:60%;overflow:auto}
#plan .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#plan .lbl{width:48px;color:#7a8b95;font-size:13px}
#plan input{flex:1;min-width:0;background:#000;color:#fff;border:1px solid #2c2c2c;border-radius:12px;padding:11px;font-size:16px}
#from{color:#4aa8ff}
#res div{padding:10px 6px;border-top:1px solid #1d1d1d;font-size:14px;color:#ccc}
#status{font-size:12px;color:#7a8b95;margin-top:4px}
#info{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:#0d0d0d;border:1px solid #222;border-radius:18px;padding:14px;z-index:5;display:none}
#info .big{font-size:22px;margin-bottom:10px}
#info .btns{display:flex;gap:8px;flex-wrap:wrap}
/* nav */
#banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--banner);border-radius:22px;padding:14px 20px;font-size:clamp(24px,6vw,42px);line-height:1.25}
#banner .r2{display:flex;align-items:center;gap:10px}
#speed{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:92px;height:92px;border-radius:50%;background:#000;border:2px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center}
#speed b{font-size:36px;line-height:1}#speed small{font-size:13px}
#compass{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:84px;height:84px;border-radius:50%;background:#000;border:2px solid #222}
#ctl{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:6}
#toast{position:absolute;top:45%;left:50%;transform:translateX(-50%);background:#111;border:1px solid #333;border-radius:14px;padding:10px 16px;z-index:9;display:none}
body.plan #banner,body.plan #speed,body.plan #compass,body.plan #ctl{display:none}
body.nav #plan,body.nav #info{display:none}
/* clean fullscreen: sirf route, location, speed */
body.clean #banner,body.clean #compass{display:none}
body.clean #speed{left:50%;transform:translateX(-50%);border:0;width:auto;height:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
body.clean #speed b{font-size:72px;font-weight:600}
body.clean #ctl{opacity:0;pointer-events:none;transition:opacity .2s}
body.clean.showctl #ctl{opacity:.95;pointer-events:auto}
</style>
</head>
<body class="plan">
<div id="stage">
  <canvas id="c"></canvas>
  <div id="banner"><div>Stay on <span id="road">road</span></div><div class="r2"><span id="dist">--</span> to <span id="arrow">↑</span></div></div>
  <div id="speed"><b id="spd">0</b><small>km/h</small></div>
  <svg id="compass" viewBox="-50 -50 100 100"><g id="needle"><polygon points="0,-34 9,0 -9,0" fill="#e8e8e8"/><polygon points="0,34 9,0 -9,0" fill="#e53935"/></g><circle r="4" fill="#000" stroke="#555"/></svg>
</div>

<div id="plan">
  <div class="row"><span class="lbl">From</span><input id="from" value="My location" readonly></div>
  <div class="row"><span class="lbl">To</span><input id="to" placeholder="Kahan jana hai? (jagah ka naam)" enterkeyhint="search"><button id="go" class="pri">Search</button></div>
  <div id="res"></div>
  <div id="status">GPS location dhoondh raha hoon…</div>
</div>
<div id="info">
  <div class="big" id="sum"></div>
  <div class="btns"><button class="pri" id="start">▶ Start</button><button id="startHud">▶ Start in HUD mode</button><button id="cancel">Cancel</button></div>
</div>
<div id="ctl">
  <button id="bHud">HUD (mirror)</button>
  <button id="bFull">⛶ Full screen</button>
  <button id="bSim">Simulate</button>
  <button id="bZin">＋</button><button id="bZout">－</button>
  <button id="bStop">■ Stop</button>
</div>
<div id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('c'),ctx=cv.getContext('2d'),W,H,DPR=window.devicePixelRatio||1;
var state='plan',zoom=1,pos=null,hd=0,spd=0,dest=null,R=null,idx=0,sim=false,simS=0,lastRe=0,lastT=0,prevP=null,wl=null;
var RAD=Math.PI/180;

function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();

/* geo helpers */
function dxy(a,o){return {x:(a.lng-o.lng)*111320*Math.cos(o.lat*RAD),y:(a.lat-o.lat)*110540};}
function dd(a,b){var v=dxy(a,b);return Math.hypot(v.x,v.y);}
function brg(a,b){var v=dxy(b,a);return (Math.atan2(v.x,v.y)/RAD+360)%360;}
function adiff(a,b){return ((b-a+540)%360)-180;}
function resample(p,step){
  var out=[p[0]],acc=0,prev=p[0];
  for(var i=1;i<p.length;i++){
    var cur=p[i],d=dd(cur,prev);
    while(d>0&&acc+d>=step){var t=(step-acc)/d;prev={lat:prev.lat+(cur.lat-prev.lat)*t,lng:prev.lng+(cur.lng-prev.lng)*t};out.push(prev);d=dd(cur,prev);acc=0;}
    acc+=d;prev=cur;
  }
  out.push(p[p.length-1]);return out;
}
function fmt(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1)+' km':Math.max(0,Math.round(m/10)*10)+' m';}
function toast(t,ms){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},ms||2500);}
function arrowFor(m){
  if(!m)return '↑';if(m.type==='arrive')return '⚑';
  if(m.type==='roundabout'||m.type==='rotary')return '↻';
  return {'left':'↰','right':'↱','slight left':'↖','slight right':'↗','sharp left':'↙','sharp right':'↘','straight':'↑','uturn':'↶'}[m.modifier]||'↑';
}

/* GPS */
if(navigator.geolocation){
  navigator.geolocation.watchPosition(function(p){
    var c=p.coords,q={lat:c.latitude,lng:c.longitude};
    if(sim)return;
    if(prevP&&dd(q,prevP)>3){hd=(hd+adiff(hd,brg(prevP,q))*.5+360)%360;prevP=q;}
    if(!prevP)prevP=q;
    if(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)hd=c.heading;
    spd=(c.speed||0)*3.6;pos=q;
    $('status').textContent='GPS ready ✓ (accuracy ~'+Math.round(c.accuracy)+' m)';
  },function(e){$('status').textContent='GPS error: '+e.message+' (HTTPS par kholo aur location allow karo)';},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}else $('status').textContent='Is browser mein GPS nahi hai';

/* search */
function search(){
  var q=$('to').value.trim();if(!q)return;
  var m=q.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
  if(m){pick({lat:+m[1],lng:+m[2]});return;}
  $('res').innerHTML='<div>Dhoondh raha hoon…</div>';
  fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q))
   .then(function(r){return r.json();}).then(function(j){
    var box=$('res');box.innerHTML='';
    if(!j.length){box.innerHTML='<div>Kuch nahi mila</div>';return;}
    j.forEach(function(it){var d=document.createElement('div');d.textContent=it.display_name;d.onclick=function(){box.innerHTML='';pick({lat:+it.lat,lng:+it.lon});};box.appendChild(d);});
   }).catch(function(){$('res').innerHTML='<div>Search fail (internet check karo)</div>';});
}
$('go').onclick=search;
$('to').addEventListener('keydown',function(e){if(e.key==='Enter')search();});

/* routing */
function fetchRoute(from,to){
  var u='https://router.project-osrm.org/route/v1/driving/'+from.lng+','+from.lat+';'+to.lng+','+to.lat+'?overview=full&geometries=geojson&steps=true';
  return fetch(u).then(function(r){return r.json();}).then(function(j){
    if(!j.routes||!j.routes.length)throw 0;
    var r=j.routes[0],pts=resample(r.geometry.coordinates.map(function(c){return {lat:c[1],lng:c[0]};}),5),steps=[];
    r.legs.forEach(function(l){steps=steps.concat(l.steps);});
    var si=[],last=0;
    steps.forEach(function(s){
      var loc={lat:s.maneuver.location[1],lng:s.maneuver.location[0]},bi=last,bd=1e12;
      for(var i=last;i<pts.length;i++){var d=dd(pts[i],loc);if(d<bd){bd=d;bi=i;}if(d>bd+400&&bd<60)break;}
      si.push(bi);last=bi;
    });
    return {pts:pts,steps:steps,si:si,dist:r.distance,dur:r.duration};
  });
}
function pick(p){
  if(!pos){toast('Pehle GPS location milne do');return;}
  dest=p;$('status').textContent='Route bana raha hoon…';
  fetchRoute(pos,dest).then(function(r){
    R=r;idx=0;$('status').textContent='';
    var mins=Math.round(r.dur/60);
    $('sum').textContent=fmt(r.dist)+' · '+(mins>=60?Math.floor(mins/60)+' hr '+mins%60+' min':mins+' min');
    $('info').style.display='block';
  }).catch(function(){$('status').textContent='Route nahi ban paya';});
}
function reroute(){
  var now=Date.now();if(now-lastRe<8000||!dest||!pos)return;lastRe=now;toast('Reroute ho raha hai…');
  fetchRoute(pos,dest).then(function(r){R=r;idx=0;simS=0;}).catch(function(){});
}

/* modes */
function startNav(hud){
  if(!R)return;state='nav';idx=0;
  document.body.className='nav'+(hud?' mirror':'');$('bHud').className=hud?'on':'';
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}
}
function stopNav(){
  state='plan';sim=false;$('bSim').className='';R=null;dest=null;$('info').style.display='none';
  document.body.className='plan';if(document.fullscreenElement)document.exitFullscreen();
  if(wl){try{wl.release();}catch(e){}wl=null;}
}
$('start').onclick=function(){startNav(false);};
$('startHud').onclick=function(){startNav(true);};
$('cancel').onclick=function(){R=null;dest=null;$('info').style.display='none';};
$('bStop').onclick=stopNav;
$('bHud').onclick=function(){document.body.classList.toggle('mirror');this.classList.toggle('on');};
$('bZin').onclick=function(){zoom=Math.min(4,zoom*1.3);};
$('bZout').onclick=function(){zoom=Math.max(.4,zoom/1.3);};
$('bSim').onclick=function(){sim=!sim;this.className=sim?'on':'';if(sim)simS=idx*5;};
$('bFull').onclick=function(){
  document.body.classList.add('clean');
  var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
};
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)document.body.classList.remove('clean','showctl');});
var ct=null;
document.addEventListener('click',function(e){
  if(!document.body.classList.contains('clean'))return;
  document.body.classList.toggle('showctl');clearTimeout(ct);
  ct=setTimeout(function(){document.body.classList.remove('showctl');},4000);
});

/* tracking */
function track(){
  var n=R.pts.length,a=Math.max(0,idx-10),b=Math.min(n,idx+300),bi=idx,bd=1e9,i,d;
  for(i=a;i<b;i++){d=dd(R.pts[i],pos);if(d<bd){bd=d;bi=i;}}
  if(bd>60){
    var fb=1e9,fi=idx;for(i=0;i<n;i++){d=dd(R.pts[i],pos);if(d<fb){fb=d;fi=i;}}
    if(fb<60){bi=fi;}else reroute();
  }
  idx=bi;
}

/* draw */
function drawLine(P,pts,a,b,step){
  ctx.beginPath();for(var i=a;i<b;i+=step){var q=P(pts[i]);if(i===a)ctx.moveTo(q[0],q[1]);else ctx.lineTo(q[0],q[1]);}
  var q2=P(pts[b-1]);ctx.lineTo(q2[0],q2[1]);ctx.stroke();
}
function drawRoute(P,a,b,step){
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#000';ctx.lineWidth=15;drawLine(P,R.pts,a,b,step);
  ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;ctx.strokeStyle='#00e5ff';ctx.lineWidth=10;drawLine(P,R.pts,a,b,step);ctx.shadowBlur=0;
}
function drawPlan(){
  if(!R)return;
  var mnL=1e9,mxL=-1e9,mnG=1e9,mxG=-1e9;
  R.pts.forEach(function(p,i){if(i%10)return;mnL=Math.min(mnL,p.lat);mxL=Math.max(mxL,p.lat);mnG=Math.min(mnG,p.lng);mxG=Math.max(mxG,p.lng);});
  var c={lat:(mnL+mxL)/2,lng:(mnG+mxG)/2},wx=Math.max(50,(mxG-mnG)*111320*Math.cos(c.lat*RAD)),hy=Math.max(50,(mxL-mnL)*110540);
  var sc=Math.min(W*.8/wx,H*.38/hy),cy=H*.5;
  var P=function(p){var v=dxy(p,c);return [W/2+v.x*sc,cy-v.y*sc];};
  drawRoute(P,0,R.pts.length,Math.max(1,Math.floor(R.pts.length/1500)));
  var s=P(R.pts[0]),e=P(R.pts[R.pts.length-1]);
  ctx.fillStyle='#2f8cff';ctx.beginPath();ctx.arc(s[0],s[1],9,0,7);ctx.fill();
  ctx.fillStyle='#ff4d4d';ctx.beginPath();ctx.arc(e[0],e[1],9,0,7);ctx.fill();
}
function drawNav(){
  if(!R||!pos)return;
  var cx=W/2,cy=H*.78,sc=(cy-H*.12)/(450/zoom),h=hd*RAD,ch=Math.cos(h),sh=Math.sin(h),cl=Math.cos(pos.lat*RAD);
  var P=function(p){var dx=(p.lng-pos.lng)*111320*cl,dy=(p.lat-pos.lat)*110540;return [cx+(dx*ch-dy*sh)*sc,cy-(dx*sh+dy*ch)*sc];};
  var a=Math.max(0,idx-2),b=Math.min(R.pts.length,idx+Math.ceil(1200/zoom/5));
  if(b-a>1)drawRoute(P,a,b,1);
  ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#2f8cff';ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(18,18);ctx.lineTo(0,9);ctx.lineTo(-18,18);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();
}
function updateBanner(){
  var k=1;while(k<R.si.length-1&&R.si[k]<=idx)k++;
  var m=R.steps[k]?R.steps[k].maneuver:null,cur=R.steps[k-1]||R.steps[0];
  $('road').textContent=(cur&&cur.name)||'road';
  $('dist').textContent=fmt(((R.si[k]!==undefined?R.si[k]:R.pts.length-1)-idx)*5);
  $('arrow').textContent=arrowFor(m);
}

function frame(t){
  var dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(state==='plan')drawPlan();
  else if(R){
    if(sim){
      simS+=35/3.6*dt;var i=Math.min(R.pts.length-2,Math.floor(simS/5));pos=R.pts[i];
      hd=(hd+adiff(hd,brg(R.pts[i],R.pts[Math.min(R.pts.length-1,i+3)]))*Math.min(1,dt*4)+360)%360;spd=35;idx=i;
    }else if(pos)track();
    drawNav();updateBanner();
    $('spd').textContent=Math.round(spd);
    $('needle').setAttribute('transform','rotate('+(-hd)+')');
    if(R.pts.length-1-idx<5){toast('Aap pahunch gaye ⚑',3000);stopNav();}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
