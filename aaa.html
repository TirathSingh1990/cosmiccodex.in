<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route HUD Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--accent:#39f5a5;--blue:#2684ff;--bg:#080d12;--panel:#111a22;--text:#edf5f7;--muted:#9fb0bc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
#app{height:100%;display:flex;flex-direction:column}.top{padding:10px 12px;background:#101820;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:500}
.brand{font-weight:800;letter-spacing:.3px;margin-right:auto}.search{display:flex;gap:6px;flex:1 1 260px}.search input{min-width:0;flex:1}
input,button{border:1px solid #344653;border-radius:10px;padding:11px 12px;font:inherit;color:var(--text);background:#0b1218}
button{cursor:pointer;font-weight:650}button.primary{background:#147c58;border-color:#1aa875}button:disabled{opacity:.45;cursor:not-allowed}
#map{flex:1;min-height:180px}.bottom{background:#101820;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:500}
.status{font-size:13px;color:var(--muted);flex:1 1 100%}.pill{font-size:13px;background:#1b2a34;padding:7px 10px;border-radius:999px}
#hud{display:none;position:fixed;inset:0;background:#000;z-index:2000;color:white;overflow:hidden;touch-action:manipulation}
#hudMap{position:absolute;inset:0;background:#000}
#hudMap .leaflet-tile-pane{filter:brightness(.48) saturate(.45) contrast(1.12)}
#hudMap .leaflet-control-container{display:none}
#hudMap .leaflet-container{background:#000}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;text-align:left;padding:14px 18px;background:rgba(0,0,0,.78);border:1px solid rgba(57,245,165,.22);border-radius:16px;box-shadow:0 4px 22px #000;text-shadow:0 0 12px #00ff9d;z-index:700}
#maneuver{font-size:clamp(22px,5vw,38px);font-weight:800;color:var(--accent);letter-spacing:.5px}
#nextdist{font-size:clamp(15px,3vw,22px);margin-top:5px;color:#d8fff0}
.hud-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:10px;right:10px;display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;z-index:700;background:rgba(0,0,0,.82);border:1px solid rgba(57,245,165,.18);border-radius:16px;padding:10px}
.hud-stat{min-width:76px;text-align:center;color:var(--accent);font-size:clamp(17px,3.8vw,26px);font-weight:750;text-shadow:0 0 12px #00ff9d}
.hud-stat small{display:block;font-size:10px;color:#9db9ad;letter-spacing:1px}
.hud-exit{position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 112px);background:rgba(0,0,0,.85);border-color:#3a5147;z-index:800}
.hud-mirror #hudMap{transform:scaleX(-1)}
.leaflet-control-attribution{font-size:9px!important}
@media(max-width:600px){.brand{width:100%}.top{gap:6px}.bottom button{flex:1}.search{flex-basis:100%}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">🧭 Route HUD</div>
    <div class="search">
      <input id="fromPlace" placeholder="From: My location or any place" autocomplete="off">
      <button id="fromBtn">Set From</button>
    </div>
    <div class="search">
      <input id="destination" placeholder="To: Search destination" autocomplete="off">
      <button id="searchBtn">Set To</button>
    </div>
    <button id="locBtn">Use my location</button>
  </div>
  <div id="map"></div>
  <div class="bottom">
    <span class="pill" id="distance">Distance: —</span>
    <span class="pill" id="duration">Time: —</span>
    <button id="routeBtn" class="primary" disabled>Build route</button>
    <button id="startBtn" disabled>Start navigation</button>
    <button id="hudBtn" disabled>HUD mode</button>
    <div class="status" id="status">Allow location access, then search a destination or tap the map.</div>
  </div>
</div>
<div id="hud">
  <div id="hudMap"></div>
  <div class="hud-top">
    <div id="maneuver">FOLLOW THE ROUTE</div>
    <div id="nextdist">Select a destination</div>
  </div>
  <button class="hud-exit" id="exitHud">Exit HUD</button>
  <div class="hud-bottom">
    <div class="hud-stat" id="hudSpeed">—<small>KM/H</small></div>
    <div class="hud-stat" id="hudRemain">—<small>REMAINING</small></div>
    <div class="hud-stat" id="hudEta">—<small>ETA</small></div>
    <button id="mirrorBtn">Mirror: Off</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
let map, me=null, routeStart=null, routeStartIsGps=true, dest=null, routeCoords=[], routeLayer=null, meMarker=null, originMarker=null, destMarker=null;
let watchId=null, navOn=false, heading=0, speed=0, routeSteps=[], stepIndex=0, totalMeters=0, remainingMeters=0, mirror=false;
let hudMap=null, hudRouteLayer=null, hudPositionMarker=null, routeDurationSeconds=0;
const mapReady=typeof L!=='undefined';
if(!mapReady){status('Map library could not load. Check your internet connection.');return;}
map=L.map('map',{zoomControl:true}).setView([30.3165,78.0322],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const icon=(color)=>L.divIcon({className:'',html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 0 0 5px ${color}44"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
function setMyLocation(lat,lon,acc=0){
  me=[lat,lon];
  if(!meMarker)meMarker=L.marker(me,{icon:icon('#2684ff')}).addTo(map).bindPopup('Your location');
  else meMarker.setLatLng(me);
  if(routeStartIsGps){
    routeStart=me;
    if(!originMarker)originMarker=L.marker(routeStart,{icon:icon('#39f5a5')}).addTo(map).bindPopup('Route start: My location');
    else originMarker.setLatLng(routeStart);
  }
  $('routeBtn').disabled=!routeStart||!dest;
  if(navOn)updateNavigation();
 if(hudMap && $('hud').style.display==='block'){
   if(hudPositionMarker)hudPositionMarker.setLatLng(me);
   hudMap.setView(me,17,{animate:false});
 }
}
function locate(){
 if(!navigator.geolocation){status('This browser does not support GPS.');return;}
 status('Getting your GPS location…');
 navigator.geolocation.getCurrentPosition(p=>{
  setMyLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
  map.setView(me,16);status(`GPS located (accuracy about ${Math.round(p.coords.accuracy)} m).`);
 },e=>status('Location error: '+e.message+'. Use HTTPS/localhost and allow location permission.'),{enableHighAccuracy:true,timeout:15000,maximumAge:3000});
}
function setDestination(lat,lon,label='Destination'){
 dest=[lat,lon];
 if(destMarker)map.removeLayer(destMarker);
 destMarker=L.marker(dest,{icon:icon('#ef4e65')}).addTo(map).bindPopup(label).openPopup();
 $('routeBtn').disabled=!me;
 $('status').textContent='Destination selected. Tap Build route.';
}
map.on('click',e=>setDestination(e.latlng.lat,e.latlng.lng));
async function geocode(q){
 status('Searching destination…');
 try{
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);
  const r=await fetch(u,{headers:{'Accept-Language':'en'}});
  const d=await r.json();
  if(!d.length){status('Place not found. Try a more specific name.');return;}
  setDestination(+d[0].lat,+d[0].lon,d[0].display_name.split(',').slice(0,2).join(','));
  map.setView(dest,15);
 }catch(e){status('Search failed. Check internet connection.');}
}
async function geocodeFrom(q){
 status('Searching starting point…');
 try{
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);
  const r=await fetch(u,{headers:{'Accept-Language':'en'}});
  const d=await r.json();
  if(!d.length){status('Starting place not found. Try a more specific name.');return;}
  routeStart=[+d[0].lat,+d[0].lon];routeStartIsGps=false;
  if(originMarker)map.removeLayer(originMarker);
  originMarker=L.marker(routeStart,{icon:icon('#39f5a5')}).addTo(map).bindPopup('Route start: '+d[0].display_name.split(',').slice(0,2).join(','));
  $('fromPlace').value=d[0].display_name.split(',').slice(0,2).join(',');
  $('routeBtn').disabled=!dest;
  map.setView(routeStart,15);
  status('Starting point set. Now choose destination and build route.');
 }catch(e){status('Starting point search failed. Check internet connection.');}
}
function useGpsAsOrigin(){
 if(!me){locate();status('Getting GPS first. Tap Use my location again when GPS is ready.');return;}
 routeStart=me;routeStartIsGps=true;
 if(originMarker)map.removeLayer(originMarker);
 originMarker=L.marker(routeStart,{icon:icon('#39f5a5')}).addTo(map).bindPopup('Route start: My location');
 $('fromPlace').value='My location';
 $('routeBtn').disabled=!dest;
 map.setView(routeStart,15);
 status('Route start set to your current GPS location.');
}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';}
async function buildRoute(){
 if(!routeStart||!dest){status('Set both From and To locations first.');return;}
 status('Finding road route…');
 try{
  const url=`https://router.project-osrm.org/route/v1/driving/${routeStart[1]},${routeStart[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`;
  const res=await fetch(url);const data=await res.json();
  if(data.code!=='Ok'||!data.routes?.length){status('No driving route found for these points.');return;}
  const r=data.routes[0];routeCoords=r.geometry.coordinates.map(c=>[c[1],c[0]]);
  routeSteps=r.legs.flatMap(l=>l.steps).filter(s=>s.maneuver);
  totalMeters=r.distance;remainingMeters=r.distance;routeDurationSeconds=r.duration;stepIndex=0;
  if(routeLayer)map.removeLayer(routeLayer);
  routeLayer=L.polyline(routeCoords,{color:'#1677ff',weight:6,opacity:.9}).addTo(map);
  map.fitBounds(routeLayer.getBounds(),{padding:[35,35]});
  $('distance').textContent='Distance: '+fmtDist(totalMeters);
  $('duration').textContent='Time: '+Math.round(r.duration/60)+' min';
  $('startBtn').disabled=false;$('hudBtn').disabled=false;
  status('Route ready. Start navigation, then switch to HUD mode.');
  updateInstruction();
 }catch(e){status('Routing service unavailable. Check internet connection and try again.');}
}
function dist(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]),x=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function nearestRouteIndex(pos){
 let best=0,bd=Infinity;for(let i=0;i<routeCoords.length;i++){let d=dist(pos,routeCoords[i]);if(d<bd){bd=d;best=i;}}return best;
}
function updateNavigation(){
 if(!me||!routeCoords.length)return;
 const idx=nearestRouteIndex(me);remainingMeters=0;
 for(let i=idx;i<routeCoords.length-1;i++)remainingMeters+=dist(routeCoords[i],routeCoords[i+1]);
 if(idx<routeCoords.length-1){const a=routeCoords[idx],b=routeCoords[idx+1];heading=(Math.atan2(Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180),Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180))*180/Math.PI+360)%360;}
 while(stepIndex<routeSteps.length-1 && routeSteps[stepIndex].distance<15)stepIndex++;
 updateInstruction();
 if(routeLayer)routeLayer.setStyle({color:'#1677ff'});
}
function instructionText(s){
 if(!s)return 'FOLLOW THE ROUTE';
 const t=s.maneuver.type, m=s.maneuver.modifier||'';
 if(t==='arrive')return 'YOU HAVE ARRIVED';
 if(t==='depart')return 'START';
 if(m.includes('left'))return 'TURN LEFT';
 if(m.includes('right'))return 'TURN RIGHT';
 if(m==='uturn')return 'MAKE A U-TURN';
 if(t==='roundabout'||t==='rotary')return 'ENTER ROUNDABOUT';
 if(t==='new name'||t==='continue'||t==='end of road')return 'CONTINUE STRAIGHT';
 return 'FOLLOW THE ROUTE';
}
function updateInstruction(){
 const s=routeSteps[stepIndex];
 $('maneuver').textContent=instructionText(s);
 $('nextdist').textContent=s?`${fmtDist(s.distance)} to next instruction`:`${fmtDist(remainingMeters)} remaining`;
 $('hudRemain').innerHTML=`${fmtDist(remainingMeters)}<small>REMAINING</small>`;
 const etaSeconds = speed > 1.5 ? remainingMeters / speed : (totalMeters > 0 ? routeDurationSeconds * (remainingMeters / totalMeters) : 0);
 $('hudEta').innerHTML=`${etaSeconds ? Math.max(1,Math.round(etaSeconds/60))+' min' : '—'}<small>TIME LEFT</small>`;
}
function startNav(){
 if(!routeCoords.length)return;
 navOn=true;status('Navigation running. Keep this page open for live GPS updates.');
 if(navigator.geolocation){
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(p=>{
   setMyLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy);
   if(p.coords.heading!=null&&!Number.isNaN(p.coords.heading))heading=p.coords.heading;
   speed=p.coords.speed||0;$('hudSpeed').innerHTML=`${Math.round(speed*3.6)}<small>KM/H</small>`;
   if(navOn)map.panTo(me,{animate:true,duration:.4});
   if(hudMap && $('hud').style.display==='block'){
     if(hudPositionMarker)hudPositionMarker.setLatLng(me);
     hudMap.setView(me,17,{animate:false});
   }
  },e=>status('GPS update error: '+e.message),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
 }
 $('startBtn').textContent='Stop navigation';$('startBtn').onclick=stopNav;
}
function stopNav(){
 navOn=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
 $('startBtn').textContent='Start navigation';$('startBtn').onclick=startNav;status('Navigation stopped.');
}
function initHudMap(){
 if(hudMap){setTimeout(()=>hudMap.invalidateSize(),120);return;}
 hudMap=L.map('hudMap',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false,zoomAnimation:false}).setView(me||routeCoords[0],17);
 // Dark Carto tiles keep nearby roads visible while the AMOLED background remains black.
 L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{
   subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'
 }).addTo(hudMap);
 hudRouteLayer=L.polyline(routeCoords,{color:'#00dff5',weight:8,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(hudMap);
 // Soft outer glow behind the route.
 L.polyline(routeCoords,{color:'#00dff5',weight:15,opacity:.22,lineCap:'round',lineJoin:'round'}).addTo(hudMap);
 const carIcon=L.divIcon({className:'',html:'<div style="width:24px;height:24px;border-radius:50%;background:#00eaff;border:3px solid white;box-shadow:0 0 0 8px #00eaff33,0 0 20px #00eaff"></div>',iconSize:[24,24],iconAnchor:[12,12]});
 hudPositionMarker=L.marker(me||routeCoords[0],{icon:carIcon,zIndexOffset:1000}).addTo(hudMap);
 hudMap.setView(me||routeCoords[0],17);
}
function openHud(){
 $('hud').style.display='block';
 $('hud').classList.toggle('hud-mirror',mirror);
 initHudMap();
 if(me&&hudMap)hudMap.setView(me,17,{animate:false});
 setTimeout(()=>{if(hudMap)hudMap.invalidateSize();},150);
 if(!navOn)status('HUD preview. Start navigation for live GPS tracking.');
}
function closeHud(){$('hud').style.display='none';}
$('locBtn').onclick=()=>{locate();useGpsAsOrigin();};
$('fromBtn').onclick=()=>{const q=$('fromPlace').value.trim();if(!q||q.toLowerCase()==='my location')useGpsAsOrigin();else geocodeFrom(q);};
$('searchBtn').onclick=()=>{if($('destination').value.trim())geocode($('destination').value.trim());};
$('destination').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click();});
$('fromPlace').addEventListener('keydown',e=>{if(e.key==='Enter')$('fromBtn').click();});
$('routeBtn').onclick=buildRoute;$('startBtn').onclick=startNav;$('hudBtn').onclick=openHud;$('exitHud').onclick=closeHud;
$('mirrorBtn').onclick=()=>{mirror=!mirror;$('hud').classList.toggle('hud-mirror',mirror);$('mirrorBtn').textContent='Mirror: '+(mirror?'On':'Off');};
window.addEventListener('resize',()=>{if($('hud').style.display==='block'&&hudMap)hudMap.invalidateSize();});
$('hud').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
locate();
setTimeout(()=>{if($('fromPlace'))$('fromPlace').value='My location';},0);
})();
</script>
</body>
</html>
